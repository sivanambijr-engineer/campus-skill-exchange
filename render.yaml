services:

  - type: web
    name: campus-skill-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-skills-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://campus-skill-exchange.onrender.com

  - type: web
    name: campus-skill-exchange
    env: static
    buildCommand: "npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campus-skill-api.onrender.com/api

databases:

  - name: campus-skills-db
    databaseName: campus_skills_db
    user: postgres

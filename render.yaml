services:
  # 1. FastAPI Web Service Backend
  - type: web
    name: campus-skill-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-skills-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # 2. React Static Site Frontend
  - type: web
    name: campus-skill-exchange
    env: static
    buildCommand: "npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campus-skill-api.onrender.com/api

databases:
  # 3. Managed PostgreSQL Database
  - name: campus-skills-db
    databaseName: campus_skills_db
    user: postgres
